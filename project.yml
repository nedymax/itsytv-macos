name: itsytv
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.itsytv
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Debug-AppStore: debug
  Release: release
  Release-AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: R892A93W42
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  ItsytvCore:
    url: https://github.com/nedymax/itsytv-core.git
    branch: dev

schemes:
  itsytv:
    build:
      targets:
        itsytv: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - itsytvTests
    archive:
      config: Release
  itsytv-appstore:
    build:
      targets:
        itsytv: all
    run:
      config: Debug-AppStore
    test:
      config: Debug-AppStore
    archive:
      config: Release-AppStore

targets:
  itsytv:
    type: application
    platform: macOS
    sources:
      - path: itsytv
        excludes:
          - "**/*.proto"
          - itsytv.entitlements
          - itsytv-direct.entitlements
    settings:
      base:
        INFOPLIST_FILE: itsytv/Info.plist
        CODE_SIGN_ENTITLEMENTS: itsytv/itsytv.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.itsytv.app
        PRODUCT_NAME: Itsytv
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ItsyTV
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "200"
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: itsytv/itsytv-direct.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: itsytv/itsytv-direct.entitlements
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    dependencies:
      - package: ItsytvCore

  itsytvTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: itsytvTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.itsytv.app.tests
        CODE_SIGNING_ALLOWED: false
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Itsytv.app/Contents/MacOS/Itsytv"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: itsytv
