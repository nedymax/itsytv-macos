name: macOS

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out macOS app
        uses: actions/checkout@v5
        with:
          path: itsytv-macos

      - name: Check out itsytv-core dependency
        uses: actions/checkout@v5
        with:
          repository: nickustinov/itsytv-core
          path: itsytv-core

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify macOS 26 toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 26([. ]|$)'

      - name: Generate Xcode project
        working-directory: itsytv-macos
        run: xcodegen generate

      - name: Build and test
        working-directory: itsytv-macos
        run: |
          set -o pipefail
          xcodebuild \
            -project itsytv.xcodeproj \
            -scheme itsytv \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package app
        working-directory: itsytv-macos
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug/Itsytv.app \
            artifacts/Itsytv-macOS-26.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Itsytv-macOS-26
          path: itsytv-macos/artifacts/Itsytv-macOS-26.zip
          if-no-files-found: error
