name: macOS

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out macOS app
        uses: actions/checkout@v4
        with:
          path: itsytv-macos

      - name: Check out itsytv-core dependency
        uses: actions/checkout@v4
        with:
          repository: nickustinov/itsytv-core
          path: itsytv-core

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: itsytv-macos
        run: xcodegen generate

      - name: Build and test
        working-directory: itsytv-macos
        run: |
          set -o pipefail
          xcodebuild \
            -project itsytv.xcodeproj \
            -scheme itsytv \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
